name: Build & Release

# - Push a tag like v1.2.0  -> builds the .exe + the voice engine and publishes a GitHub Release.
# - Run manually (Actions tab -> "Run workflow") -> builds and uploads them as artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The voice engine package must be built with the SAME Python version as the .exe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = python -c "import app; print(app.__version__)"
          if ($tag -ne $ver) { Write-Error "Tag v$tag does not match app/__init__.py version $ver"; exit 1 }

      - name: Build exe
        run: python tools/build_exe.py

      - name: Build voice engine package
        run: python tools/build_voice_engine.py

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem DotaChatTranslator.exe, voice-engine-*.zip | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DotaChatTranslator
          path: |
            dist/DotaChatTranslator.exe
            dist/voice-engine-*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DotaChatTranslator.exe
            dist/voice-engine-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
