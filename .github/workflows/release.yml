name: Build & Release

# - Push a tag like v1.0.0  -> builds the .exe and publishes a GitHub Release with it.
# - Run manually (Actions tab -> "Run workflow") -> builds and uploads the .exe as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = python -c "import app; print(app.__version__)"
          if ($tag -ne $ver) { Write-Error "Tag v$tag does not match app/__init__.py version $ver"; exit 1 }

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name DotaChatTranslator
          --icon assets/icon.ico
          --add-data "assets/icon.ico;assets"
          --add-data "app/glossary.json;app"
          --collect-data customtkinter
          run.py

      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/DotaChatTranslator.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DotaChatTranslator.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DotaChatTranslator
          path: |
            dist/DotaChatTranslator.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DotaChatTranslator.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
